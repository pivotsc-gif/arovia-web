<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Brand Teal Glow Top-Right -->
    <radialGradient id="tealGlow" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#008794" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#005662" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#091823" stop-opacity="0" />
    </radialGradient>
    
    <!-- Warm Gold Glow Bottom-Left -->
    <radialGradient id="goldGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#c29039" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#0a2d33" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#091823" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#008794" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="1.5" fill="#008794" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Deep Slate Tech Base -->
  <rect width="100%" height="100%" fill="#091823" />

  <!-- Ambient Light Fields -->
  <rect width="100%" height="100%" fill="url(#tealGlow)" />
  <rect width="100%" height="100%" fill="url(#goldGlow)" />
  <rect width="100%" height="100%" fill="url(#techGrid)" />

  <!-- Soft Geometric Lines & Data Node Accents -->
  <g stroke="#008794" stroke-opacity="0.12" stroke-width="1.2" fill="none">
    <path d="M 200,100 L 450,220 L 700,160 L 950,300 L 1200,240 L 1450,380" stroke-dasharray="6 4" />
    <path d="M 150,450 L 350,550 L 600,480 L 850,620 L 1100,540 L 1350,680" stroke-dasharray="8 6" />
  </g>
  
  <g fill="#008794" fill-opacity="0.25">
    <circle cx="450" cy="220" r="4" />
    <circle cx="700" cy="160" r="3" />
    <circle cx="950" cy="300" r="5" />
    <circle cx="1200" cy="240" r="3.5" />
    <circle cx="350" cy="550" r="3" />
    <circle cx="850" cy="620" r="4.5" />
    <circle cx="1100" cy="540" r="3" />
  </g>
</svg>

